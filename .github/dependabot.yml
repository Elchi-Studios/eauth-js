version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # The frameworks are peer dependencies; their ranges are decisions, not
    # updates. Only the tools used to build and test are kept current.
    versioning-strategy: increase-if-necessary
    groups:
      development:
        dependency-type: development
    ignore:
      - dependency-name: "@elchi-studios/*"
